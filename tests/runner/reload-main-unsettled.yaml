scenario: 1
name: runner/reload-main-unsettled
pack: notes-app
summary: >-
  A reload with `settle: false`: the scenario waits for what the reloaded page
  shows instead of the implicit settled (an application that takes longer to
  load than to settle after an input).
stage:
  - use: seed-notes
    with: { fixture: ../../conformance/fixtures/three-notes.json }
  - use: launch-app
steps:
  - reload: main
    settle: false
  - wait: { until: "note-list.loaded" }
  - expect: { at: note-list, count: 3 }
