scenario: 1
name: runner/act-writes-a-file
pack: notes-app
summary: An act step makes a change outside the application between two steps.
stage:
  - use: seed-notes
    with: { fixture: ../../conformance/fixtures/three-notes.json }
  - use: launch-app
steps:
  - expect: { at: note-list, count: 3 }
  - act:
      use: write-file
      with:
        path: /tmp/dvs-act-test-file
        content: "written by another program\n"
  - expect: { at: note-list, count: 3 }
